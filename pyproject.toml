[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbf-event-classifier"
version = "0.1.0"
description = "Modular framework for benchmarking ML classifiers on VBF event datasets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["machine learning", "classification", "particle physics", "VBF", "benchmarking"]

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "imbalanced-learn",
  "matplotlib",
  "seaborn",
  "tqdm",
  "joblib",
  "torch",
  "skl2onnx",
  "onnxruntime",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["ml_framework*"]

[tool.setuptools.package-data]
# Keep method default configs available when installed (editable or wheel).
ml_framework = ["methods/**/config.json", "generators/**/config.json"]
